    <circle cx="326" cy="128" r="39"/><circle cx="436" cy="123" r="54"/><circle cx="546" cy="129" r="45"/>
    <circle cx="656" cy="122" r="58"/><circle cx="766" cy="127" r="41"/><circle cx="876" cy="123" r="56"/>
    <circle cx="986" cy="128" r="43"/><circle cx="1096" cy="122" r="60"/><circle cx="1206" cy="127" r="39"/>
    <circle cx="1316" cy="123" r="54"/><circle cx="1426" cy="128" r="47"/><circle cx="1536" cy="122" r="56"/>
  </g>
